name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run at a time per ref, so two pushes to main can never release concurrently.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release --locked
      - run: ./target/release/tree-cleaner --version

  # The release itself only runs after a merge, so a broken preset or changelog template
  # would only surface then (it did once: conventionalcommits@10 needs a newer writer than
  # semantic-release ships). This job treats the pull request branch as a release branch and
  # runs semantic-release in dry-run mode, which reaches analyzeCommits and generateNotes
  # without tagging, committing or publishing anything.
  release-dry-run:
    name: release dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # semantic-release verifies push access even in dry-run mode; nothing is written.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # --no-ci overrides the "this is a pull request, skip" guard; --branches makes the
      # pull request branch the release branch for this run only.
      - run: npx semantic-release --dry-run --no-ci --branches "${{ github.head_ref }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Semantic release: reads the Conventional Commits since the last tag, decides the next
  # version (feat → minor, fix/perf → patch, "!" or BREAKING CHANGE → major), updates
  # Cargo.toml, Cargo.lock, CHANGELOG.md and the Homebrew formula, commits with [skip ci],
  # tags vX.Y.Z and opens the GitHub release. Nothing happens when no relevant commit landed.
  release:
    name: semantic release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.semantic.outputs.released }}
      version: ${{ steps.semantic.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - id: semantic
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

  # Prebuilt binaries attached to the release that semantic release just created.
  binaries:
    name: binaries (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Build and package every target
        shell: bash
        env:
          VERSION: ${{ needs.release.outputs.version }}
          TARGETS: ${{ matrix.targets }}
        run: |
          set -euo pipefail
          mkdir -p dist
          IFS=',' read -ra targets <<< "$TARGETS"
          for target in "${targets[@]}"; do
            cargo build --release --locked --target "$target"
            name="tree-cleaner-v${VERSION}-${target}"
            tar -C "target/${target}/release" -czf "dist/${name}.tar.gz" tree-cleaner
            (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
          done
          ls -l dist
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v${VERSION}" dist/* --clobber
